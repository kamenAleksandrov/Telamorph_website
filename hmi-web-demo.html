 const displayDefaults='Brightness 80%; idle dim 5 min; reduced motion Off; Running view Split; time format 24-hour.';

 $('message-actions').replaceChildren(cancel,choice('Display preferences',displayKeys,displayDefaults),choice('Program preferences',programKeys,programDefaults),choice('Both groups',[...displayKeys,...programKeys],displayDefaults+' '+programDefaults));$('message').showModal();cancel.focus();

 // The fixture stands in for a bounded read-only assessment; no transport exists.
 const [title,text,label]=copies[assessment];confirmAction(title,text+' (Simulated assessment.)',label,attemptRestart);
}
function attemptRestart(){
 const outcomes={accepted:['Restart accepted - preview','Simulated controller acceptance. The device would now wait for reconnection and verify the controller session and current state. No actual restart occurred.'],rejected:['Restart refused - preview','Simulated controller reason: operation in progress. The refusal is final for this request. Confirmation does not force a reset.'],unknown:['Restart outcome unknown - preview','No final response was received in this scenario. The device must read current controller state; it must not automatically repeat the restart request.'],unsent:['Could not send restart request - preview','No eligible communication path is available in this scenario. Nothing is queued for reconnect.']};
 const [title,text]=outcomes[$('restart-result').value];tell(title,text);
}
