/* HMI typeface: Tomorrow HMI (our cut of Tomorrow, SIL OFL 1.1), shared with the LVGL presentation (fonts/README.md). */
#soft .screen,#soft .screen *,#soft dialog,#soft dialog *{font-family:'Tomorrow HMI',system-ui,sans-serif}
/* ============================================================================
   Soft-tile theme: the adopted HMI style (LVGL port pending).
   Rules:
   - Three depth levels: page < panel < tile. Interactive items are tiles,
     i.e. lighter than whatever they sit on. Value fields are recessed wells.
   - Every button carries a 2px gradient edge on the side facing away from
     where it sits on screen (bottom bar -> top edge, left rail -> right
     edge, top toolbar -> bottom edge, right-hand controls -> left edge).
   - Selected items get a brighter face and a full-strength edge.
   - Important actions (primary, pause, delete/stop) also colour their text.
   Everything below is scoped to #soft so it overrides the base layer without
   editing it.
   ========================================================================== */
/* Colours are theme tokens (the hmi-theme block above, generated from
   app/hmi/presentation/theme/themes.json); never write a colour value here. */
#soft{
 --tile-hi-on:var(--tile-hi);--tile-lo-on:var(--tile-lo);
 --radius:10px;--radius-lg:12px;
 --lift:inset 0 1px 0 var(--highlight),0 2px 6px var(--shadow-lift);
}
#soft .screen{background:var(--page);border-radius:14px;box-shadow:0 0 0 1px var(--screen-rim),0 18px 40px var(--shadow-screen)}

/* ---- Tiles: every button inside the HMI and the message dialog ---------- */
#soft .screen button,#soft dialog button,#soft .screen div.stage-card{
 --edge:var(--amber-soft);--glow:transparent;--glow-reach:55%;
 --edge-at:center bottom;--edge-w:100%;--edge-h:2px;--edge-dir:90deg;--glow-dir:0deg;
 --face-hi:var(--tile-hi);--face-lo:var(--tile-lo);
 color:var(--text);border:1px solid var(--hairline);border-radius:var(--radius);
 background:
  linear-gradient(var(--edge-dir),transparent 0%,var(--edge) 28%,var(--edge) 72%,transparent 100%) var(--edge-at)/var(--edge-w) var(--edge-h) no-repeat,
  linear-gradient(var(--glow-dir),var(--glow),transparent var(--glow-reach)) no-repeat,
  linear-gradient(180deg,var(--face-hi),var(--face-lo)) no-repeat;
 background-origin:border-box;
 box-shadow:var(--lift);opacity:1;
 transition:filter .12s ease,transform .06s ease;
}
#soft .screen button:hover:not(:disabled),#soft dialog button:hover:not(:disabled){filter:brightness(1.07)}
#soft .screen button:active:not(:disabled),#soft dialog button:active:not(:disabled){transform:translateY(1px);filter:brightness(1.12)}
#soft .screen button:disabled,#soft dialog button:disabled{--edge:transparent;--glow:transparent;--face-hi:var(--tile-hi-disabled);--face-lo:var(--tile-lo-disabled);color:var(--dim);box-shadow:none;opacity:1}
#soft button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#soft .screen button.top-light,#soft .screen button.top-light:hover:not(:disabled),#soft .screen button.top-light:active:not(:disabled){background:transparent;border:0;border-radius:0;box-shadow:none;transform:none;filter:none}

/* Edge placement: opposite the side of the screen the button sits on. */
#soft .nav button,#soft .actions button,#soft .edit-actions button,#soft .program-actions:not(.program-quarters) button,
#soft .run-controls button,#soft .manual-actions button,#soft .manual-control button,
#soft .program-editor-actions button,#soft .device-footer button,#soft dialog button,
#soft .keyboard-layout button{--edge-at:center top;--glow-dir:180deg}
#soft .rail button,#soft .quick-launch button{--edge-w:0px;--edge-h:0px;--ring-dir:to left;--glow-dir:270deg}
#soft .edit-field button,#soft .screen .device-row,#soft .content .row .value{--edge-w:0px;--edge-h:0px;--ring-dir:to right;--glow-dir:90deg}

/* Selected / active: brighter face, full-strength edge. */
#soft .rail button.active,#soft .nav button.selected,#soft .device-toolbar .chosen,
#soft .selectors button.selected,#soft .keyboard-row .shift-on{
 --face-hi:var(--tile-hi-on);--face-lo:var(--tile-lo-on);--edge:var(--amber);--glow:var(--amber-glow);--glow-reach:85%;color:var(--text);font-weight:600}

/* Important actions: only their text is coloured, so they never read as selected. */
#soft .screen button.primary,#soft dialog button.primary,#soft .screen .pause-action,#soft .screen .program-favourite{
 --edge:var(--amber);color:var(--amber-text)!important;font-weight:600}
#soft .screen button.danger,#soft dialog button.danger,#soft .program-toolbar .delete-action{
 --edge:var(--red);color:var(--red-text)!important;font-weight:600}
#soft .screen button.cancel-action,#soft dialog button.cancel-action{--edge:var(--red);color:var(--red-text)!important;font-weight:600}
#soft .screen button.edit-action{--edge:var(--yellow);color:var(--yellow-text)!important;font-weight:600}
#soft .screen button.primary:disabled,#soft .screen button.danger:disabled,#soft dialog button.danger:disabled,#soft .screen button.edit-action:disabled,#soft .screen button.cancel-action:disabled{color:var(--dim)!important;--edge:transparent;--glow:transparent}
/* The old outlined "stage action" buttons become ordinary tiles. */
#soft .stage-action{border:1px solid var(--hairline)!important;color:var(--text)!important;background:
  linear-gradient(90deg,transparent 0%,var(--amber-soft) 28%,var(--amber-soft) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,var(--tile-hi),var(--tile-lo))!important}
#soft .stage-action:hover{background:
  linear-gradient(90deg,transparent 0%,var(--amber-soft) 28%,var(--amber-soft) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,var(--tile-hi-hover),var(--tile-lo-hover))!important}

/* ---- Panels and information tiles --------------------------------------- */
#soft .program-graph,#soft .furnace-panel,#soft .quick-launch,#soft .manual-controls,#soft #touch-keyboard{
 background:var(--panel);border:1px solid var(--hairline);border-radius:var(--radius-lg);box-shadow:none}
#soft .row,#soft .metric,#soft .home-readings,#soft .program-facts,#soft .device-empty,#soft .device-log-row,
#soft .program-editor-name,#soft .program-stage-row,#soft .cooling-summary div,#soft .edit-field{
 background:linear-gradient(180deg,var(--tile-hi),var(--tile-lo));border:1px solid var(--hairline);border-radius:var(--radius-lg);box-shadow:var(--lift)}
#soft .program-editor-name{background:var(--panel);box-shadow:none}
#soft .edit-field button{--face-hi:var(--field-hi);--face-lo:var(--field-lo)}
#soft .metric{padding:12px 12px 10px}
#soft .home-readings{padding:14px 16px}
#soft .program-fact.material,#soft .program-duration{border-top-color:var(--hairline-strong)}
#soft .program-summary{border-top-color:var(--hairline-strong)}
#soft .program-summary span+span{border-left-color:var(--hairline-strong)}
#soft .subtitle,#soft .row small,#soft .metric span,#soft .metric small,#soft .home-readings small,#soft .furnace-status small,
#soft .program-fact span,#soft .program-graph-label,#soft .device-row small,#soft .validity,#soft .device-footer span,
#soft .actions .status,#soft .run-reading small,#soft .manual-control span,#soft .edit-field label,#soft .page-label{color:var(--muted)}

/* ---- Bottom navigation: separate tiles, top edge ------------------------ */
#soft .nav{background:transparent;gap:8px;overflow:visible;border-radius:0}
#soft .nav button{border-radius:var(--radius);color:var(--muted);--edge:var(--amber-quiet)}
#soft .nav button.selected{color:var(--text);box-shadow:var(--lift)}

/* ---- Left rail (Device, Settings) --------------------------------------- */
#soft .rail{gap:6px}
#soft .rail button{--edge:var(--amber-quiet);color:var(--muted);min-height:50px;padding-left:14px}
#soft .rail button.active{color:var(--text)}

/* ---- Settings rows: the row is the tile; its value is the touch target --- */
#soft .content .row .value{--face-hi:transparent;--face-lo:transparent;box-shadow:none;border-color:transparent;border-radius:8px;min-height:40px;padding:4px 12px}
#soft .content .row:has(.value:is(button)){--edge:var(--amber-soft);--ring-dir:to right}
#soft .content .row .value:is(button){--edge:transparent}

/* ---- Device rows: status-coloured left edge ----------------------------- */
#soft .screen .device-row{border-radius:var(--radius-lg);--edge:var(--neutral-edge)}
#soft .device-row:has(.tone-due){--edge:var(--amber)}
#soft .device-row:has(.tone-fault){--edge:var(--red)}
#soft .device-row:has(.tone-ok){--edge:var(--ok)}
#soft .tone-ok{color:var(--ok)}

/* ---- Programs ------------------------------------------------------------ */
#soft .screen .program-card{border-radius:var(--radius-lg);padding:12px 14px}
#soft button.stage-card,#soft div.stage-card{border-radius:var(--radius-lg)}
#soft .screen .stage-card:has(.stage-heating){--edge:var(--heat)}
#soft .screen .stage-card:has(.stage-hold){--edge:var(--hold)}
#soft .screen .stage-card:has(.stage-cooling){--edge:var(--cool)}
#soft .stage-number{border-radius:6px;border-width:1px}
#soft .program-toolbar .icon-action{font-size:22px}

/* Stage type selector: selected type uses its own colour. */
#soft .stage-types button{--edge:var(--neutral-edge);color:var(--muted)}
#soft .stage-types button.selected{--face-hi:var(--tile-hi-on);--face-lo:var(--tile-lo-on);--glow-reach:85%;font-weight:600}
#soft .stage-types .stage-type-heating.selected{--edge:var(--heat);--glow:var(--heat-glow);color:var(--heat)}
#soft .stage-types .stage-type-hold.selected{--edge:var(--hold);--glow:var(--hold-glow);color:var(--hold-text)}
#soft .stage-types .stage-type-cooling.selected{--edge:var(--cool);--glow:var(--cool-glow);color:var(--cool-text)}

/* ---- Value fields are recessed wells ------------------------------------ */
#soft .edit-field input,#soft .edit-field select,#soft .keyboard-input,#soft dialog input{
 background:
  linear-gradient(90deg,transparent 0%,var(--field-edge,var(--amber-soft)) 28%,var(--field-edge,var(--amber-soft)) 72%,transparent 100%) center bottom/100% 2px no-repeat,
  var(--well);
 border:1px solid var(--hairline);border-radius:8px;color:var(--text);box-shadow:inset 0 2px 4px var(--shadow-inset)}
#soft .keyboard-input{background:
  linear-gradient(90deg,transparent 0%,var(--amber) 28%,var(--amber) 72%,transparent 100%) center bottom/100% 2px no-repeat,var(--well)}
#soft .manual-control .manual-value,#soft .screen .program-name-field,#soft .program-editor-name button{
 --face-hi:var(--well);--face-lo:var(--well);--edge:var(--amber-soft);--edge-at:center bottom;--glow:transparent;
 box-shadow:inset 0 2px 4px var(--shadow-inset)}

/* ---- Running ------------------------------------------------------------- */
#soft .run-controls .selectors{gap:6px}
#soft .selectors button{--edge:var(--amber-quiet);color:var(--muted);border-radius:var(--radius)}
#soft .selectors button.selected{box-shadow:var(--lift)}
#soft .run-readings.run-line{background:linear-gradient(180deg,var(--tile-hi),var(--tile-lo));border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:4px 14px;box-shadow:var(--lift)}
#soft .run-readings.run-line>span{background:transparent}
#soft .run-title span{color:var(--amber-text)}

/* ---- Keyboard ------------------------------------------------------------ */
#soft #touch-keyboard{box-shadow:0 -6px 30px var(--shadow-keyboard)}
#soft #touch-keyboard.numeric-keypad{box-shadow:0 0 0 2000px var(--scrim)}
#soft .keyboard-layout button{--edge:transparent;border-radius:9px}
#soft .keyboard-layout .function-key,#soft .keyboard-bottom button:not(.space-key):not(.primary),#soft .keyboard-number-actions button:not(.primary){--edge:var(--neutral-edge);color:var(--muted)}
#soft .keyboard-layout button.primary{--edge:var(--amber)}
#soft .keyboard-layout .shift-on{--edge:var(--amber);--glow:var(--amber-glow);--face-hi:var(--tile-hi-on);--face-lo:var(--tile-lo-on);color:var(--amber-text)}
#soft .keyboard-input::selection{background:var(--amber-selection);color:var(--text)}

/* ---- Dialog -------------------------------------------------------------- */
#soft dialog{background:
  linear-gradient(90deg,transparent 0%,var(--amber) 28%,var(--amber) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,var(--dialog-hi),var(--dialog-lo));
 border:1px solid var(--hairline-strong);border-radius:14px;box-shadow:0 20px 50px var(--shadow-dialog)}
#soft dialog:has(footer .danger){background:

/* ---- Card grids (Device, Settings): rectangular tiles that fill the page --
   Rows stretch to the height left above the footer. Action cards are buttons,
   tappable on their whole surface, with a lit left edge (status colour on
   Device); information cards have no edge. */
#soft .card-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;flex:1 1 0;min-height:0}
#soft .card-grid .span-2{grid-column:span 2}
#soft .card-grid .span-3{grid-column:span 3}
#soft .card-grid .rows-2{grid-row:span 2}
#soft .card,#soft .screen button.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:2px;min-width:0;min-height:0;height:auto;
 padding:10px 12px;text-align:left;font-size:inherit;font-weight:400;overflow:hidden;color:var(--text);
 background:linear-gradient(180deg,var(--tile-hi),var(--tile-lo));border:1px solid var(--hairline);border-radius:var(--radius-lg);box-shadow:var(--lift)}
#soft .screen button.card{--edge:var(--amber-soft)}
#soft .screen button.card::before{content:"";position:absolute;inset:-1px auto -1px -1px;width:2px;pointer-events:none;
 background:linear-gradient(180deg,transparent 0%,var(--edge) 24%,var(--edge) 76%,transparent 100%)}
#soft .screen button.card.card-due{--edge:var(--amber)}
#soft .screen button.card.card-fault,#soft .screen button.card.card-danger{--edge:var(--red)}
#soft .screen button.card.card-ok{--edge:var(--ok)}
#soft .screen button.card.card-neutral{--edge:var(--neutral-edge)}
#soft .card-label{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--muted);min-width:0}
#soft .card-label>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#soft .card-label .icon{width:16px;height:16px}
#soft .card-tag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
#soft .card-tag .icon{width:16px;height:16px}
#soft .card-value{font-size:24px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#soft .card-value.small{font-size:18px;font-weight:600;line-height:1.25;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
#soft .card-caption{font-size:11px;line-height:15px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
/* The clock card centres time and date under its label. */
#soft .clock-card{justify-content:flex-start}
#soft .clock-card .card-value{margin-top:auto;font-size:48px;font-weight:600;line-height:1.1}
#soft .clock-card .card-caption{margin-bottom:auto;font-size:20px;line-height:26px;color:var(--text)}
#soft .card-grid.fixed-rows{grid-template-rows:repeat(var(--rows,3),minmax(0,1fr))}
#soft .card-grid .device-empty{grid-column:1/-1;grid-row:1/-1}
/* Brightness: a tappable ten-step gauge between -/+; lit steps brighten left to right. */
/* The heading sits just above the bars; the pair is centred in the card. */
#soft .gauge-card{justify-content:center;gap:10px}
#soft .gauge{display:flex;align-items:stretch;gap:6px;height:44px;flex:none}
#soft .screen .gauge>button{width:56px;min-width:56px;min-height:0;height:100%;padding:0;flex:none}
#soft .gauge-steps{flex:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
#soft .screen .gauge-steps button{min-width:0;min-height:0;height:100%;padding:0;border:1px solid var(--hairline);box-shadow:none;
 --edge:transparent;--face-hi:var(--well);--face-lo:var(--well)}
#soft .screen .gauge-steps button.on{--face-hi:color-mix(in srgb,var(--amber) calc(var(--a)*100%),transparent);--face-lo:color-mix(in srgb,var(--amber) calc(var(--a)*100%),transparent)}
/* Choice and Set date & time dialogs */
#soft #message-body:empty{display:none}
#soft dialog .dialog-close{position:absolute;top:12px;right:12px;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;display:grid;place-items:center;--edge-at:center bottom;--glow-dir:0deg}
#soft dialog .dialog-close .icon{width:20px;height:20px}
#soft dialog:has(.dialog-close) #message-title{padding-right:52px}
#soft #message-actions:empty{display:none}
/* Device log: filter tabs, date headings, one-line event rows with the type icon and time. */
#soft .log-toolbar button{flex:1 1 0;min-width:0;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#soft .log-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;overflow:hidden}
#soft .log-day{height:22px;min-height:22px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
#soft .screen button.log-row{height:44px;min-height:44px;flex:none;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 12px;text-align:left}
#soft .log-row .log-time{display:flex;align-items:center;gap:8px;flex:none;min-width:88px;font-size:13px;color:var(--muted)}
#soft .log-row .log-time .icon{width:18px;height:18px;flex:none}
#soft .log-row .log-time .icon.tone-neutral{color:var(--amber-text)}
#soft .log-row .log-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
#soft .log-row[data-tone=due]{--edge:var(--amber)}
#soft .log-row[data-tone=fault]{--edge:var(--red)}
#soft .log-row[data-tone=ok]{--edge:var(--ok)}
#soft dialog .support-qr{width:224px;height:224px;margin:4px auto 0;padding:12px;background:var(--qr-plate);border-radius:8px}
#soft dialog .support-qr-code{width:100%;height:100%;background:var(--qr-ink)}
#soft #message-text:empty{display:none}
#soft dialog .choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 16px}
#soft dialog .choice-grid button{min-height:56px;min-width:0}
#soft dialog .choice-grid button{padding-left:6px;padding-right:6px;white-space:nowrap}
#soft dialog .choice-grid button.chosen{--edge:var(--amber);--glow:var(--amber-glow);--glow-reach:85%;font-weight:600}
#soft dialog .clock-picker{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:6px}
#soft dialog .clock-column{display:flex;flex-direction:column;gap:4px;min-width:0}
#soft dialog .clock-column>span{font-size:11px;color:var(--muted);text-align:center}
#soft dialog .clock-column>strong{height:44px;display:flex;align-items:center;justify-content:center;background:var(--well);
 box-shadow:inset 0 -2px 0 var(--amber-soft);font-size:20px;font-weight:600}
#soft dialog .clock-column>button{height:44px;min-height:44px;min-width:0;padding:0}
#soft dialog .clock-preview{margin:12px 0 16px;text-align:center;font-size:15px;color:var(--text)}
/* ---- Small grey text: never below 13 px (Tomorrow's thin strokes fade at small sizes) */
#soft .row small,#soft .actions .status,#soft .device-row small,#soft .device-row .tag,#soft .metric span,#soft .metric small,
#soft .validity,#soft .stage-meta,#soft .stage-target small,#soft .quick-launch small,#soft .edit-note,#soft .keyboard-heading span,
#soft .keyboard-hint,#soft .run-time-part small,#soft .manual-note,#soft .program-stage-row .summary small,#soft .program-editor-actions .status,
#soft .cooling-note,#soft .cooling-summary small,#soft .controller-pending,#soft .device-log-row small,#soft .device-footer span,
#soft .card-label,#soft .card-tag,#soft .card-caption,#soft dialog .clock-column>span{font-size:13px}
#soft .card-label,#soft .card-caption{line-height:17px}
#soft .manual-controls .manual-control>.manual-caption{font-size:12px;letter-spacing:0}
/* ---- Controller alert (HMI): a fault, or the controller link lost/restored -- */
#soft dialog.alert-dialog h2{display:flex;align-items:center;gap:10px}
#soft dialog.alert-dialog h2 .icon{width:22px;height:22px;flex:none}
#soft dialog.alert-fault{background:
  linear-gradient(90deg,transparent 0%,var(--red) 28%,var(--red) 72%,transparent 100%) center top/100% 2px no-repeat,
  linear-gradient(180deg,var(--dialog-hi),var(--dialog-lo))}
#soft dialog.alert-fault h2 .icon{color:var(--red)}
#soft dialog.alert-link h2 .icon{color:var(--amber)}
#soft dialog.alert-ok h2 .icon{color:var(--ok)}
/* Running after a controller-reported fault or while the link is lost. */
#soft .run-title .run-fault{color:var(--red-text)}
#soft .run-title .run-stale{color:var(--stale-text)}
#soft .run-readings.is-stale strong{color:var(--muted)}

/* ==========================================================================
   Demo page (outside the HMI rectangle): Telamorph website style.
   Tokens follow telamorph.com assets/css/main.css. Nothing here is HMI.
   ========================================================================== */
#soft{
 --tm-bg:#111215;--tm-bg-2:#18191d;--tm-card:#1e2024;--tm-elevated:#252730;
 --tm-text:#eaedf0;--tm-muted:#909295;--tm-soft:#b9c0c7;
 --tm-accent:#5ba8f5;--tm-accent-deep:#3d93ed;--tm-teal:#2dd4bf;
 --tm-border:#2a3038;--tm-border-light:#333a44;
 --tm-radius-sm:.375rem;--tm-radius:.625rem;--tm-radius-lg:1rem;--tm-ease:.2s ease;
 --tm-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* Base colour on html; body stays transparent so the floor glow layer shows (website glow.css). */
#soft body,#soft .demo-shell,#soft .demo-shell:fullscreen,#soft .demo-shell.is-fallback-fullscreen{background:#0c0e10}
#soft{background:var(--tm-bg)}
#soft body{background:transparent}
#soft body{display:block;margin:0;padding:0;min-height:100dvh;gap:0;color:var(--tm-text);font:15px/1.5 var(--tm-font);overflow-x:hidden}
/* Floor glow: one static blue light in the website glow material (glow.css / composite.css:
   rgba(91,168,245) into rgba(61,147,237), blurred 40px), centred and anchored to the bottom of
   the page as if it lights the floor under the screen. */
#soft body::before{content:"";position:fixed;left:-10%;right:-10%;bottom:-14%;height:90%;z-index:-1;pointer-events:none;
 background:radial-gradient(58% 70% at 50% 100%,rgba(91,168,245,.38),rgba(61,147,237,.18) 42%,transparent 74%);filter:blur(40px)}
@media (hover:none),(pointer:coarse){#soft body::before{filter:none}}

#soft .demo-shell{position:relative;width:100%;max-width:none;min-height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:0;background:transparent;padding:0;font-family:var(--tm-font)}
#soft .demo-shell a{color:var(--tm-accent);text-decoration:none}
#soft .demo-shell a:hover{color:#fff}
#soft .demo-shell :is(button,a):focus-visible{outline:2px solid var(--tm-accent);outline-offset:2px}

/* ---- Website bar ---------------------------------------------------------- */
#soft .site-bar{position:relative;display:flex;align-items:center;gap:18px;margin:14px clamp(16px,3vw,40px) 0;padding:10px 14px 10px 18px;min-height:64px;
 border:1px solid rgba(255,255,255,.09);border-radius:var(--tm-radius-lg);
 background:linear-gradient(160deg,rgba(37,39,48,.72) 0%,rgba(17,18,21,.92) 100%);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
 box-shadow:0 24px 70px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.04)}
#soft .site-bar::after{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--tm-accent),transparent);opacity:.7}
#soft .site-brand{display:inline-flex;align-items:center;gap:10px;color:#fff!important;font-weight:700;font-size:21px;letter-spacing:.02em;flex:none}
#soft .site-brand svg{width:44px;height:40px;display:block}
#soft .site-brand:hover{color:var(--tm-accent)!important}
#soft .site-title{display:flex;align-items:center;gap:12px;min-width:0;flex:1;padding-left:18px;border-left:1px solid var(--tm-border-light)}
#soft .site-title strong{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#soft .live-pill{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#e9c27a;
 border:1px solid rgba(232,160,75,.4);border-radius:999px;padding:4px 11px;background:rgba(232,160,75,.1)}
#soft .live-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#e8a04b;box-shadow:0 0 10px #e8a04b}
#soft .site-actions{display:flex;align-items:center;gap:10px;flex:none;margin-left:auto}

/* ---- Website buttons (buttons.css) ------------------------------------------ */
#soft .tm-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:.6rem 1.15rem;
 border-radius:var(--tm-radius);font:600 14px/1.2 var(--tm-font);letter-spacing:.01em;color:var(--tm-text)!important;cursor:pointer;white-space:nowrap;
 transition:transform var(--tm-ease),border-color var(--tm-ease),box-shadow var(--tm-ease),color var(--tm-ease),background-color var(--tm-ease)}
#soft .tm-btn svg{width:18px;height:18px;flex:none}
#soft .tm-btn-accent{background:var(--tm-card);border:1px solid var(--tm-accent-deep);box-shadow:0 6px 22px -8px rgba(61,147,237,.45),inset 0 1px 0 rgba(255,255,255,.03)}
#soft .tm-btn-accent:hover{color:#fff!important;border-color:var(--tm-accent);transform:translateY(-2px);box-shadow:0 10px 28px -8px rgba(61,147,237,.55),inset 0 1px 0 rgba(255,255,255,.04)}
#soft .tm-btn-outline{background:rgba(255,255,255,.03);border:1px solid var(--tm-border-light);box-shadow:0 4px 18px -10px rgba(0,0,0,.4)}
#soft .tm-btn-outline:hover{color:#fff!important;border-color:var(--tm-accent-deep);transform:translateY(-2px);box-shadow:0 8px 24px -10px rgba(61,147,237,.35)}
#soft .tm-btn:active{transform:none}
#soft .tm-btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
#soft .tm-btn[hidden]{display:none}
#soft .screen button.pause-action:disabled{--edge:transparent;color:var(--dim)!important}

/* ---- Stage: HMI and control panel ----------------------------------------- */
/* Layout modes (classes set by updateDemoViewport):
   .fits-view   outside fullscreen: the page is one window tall and scrolls only when
                the window is below a usable minimum height;
   .uses-drawer below 1181 px, mobile or fullscreen: the control panel is a side menu;
   .is-compact  mobile (narrow or short landscape): website links move into the menu. */
#soft .demo-stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;padding:22px clamp(16px,3vw,40px) 12px;min-height:0}
#soft .viewport-area{position:relative;width:100%;height:auto;display:flex;justify-content:center;align-items:flex-start;min-width:0;min-height:0;overflow:visible}
#soft .viewport-frame{position:relative;flex:none;isolation:isolate}
#soft .viewport-frame>.screen{transform-origin:top left}
/* The screen floats with no frame over the floor glow. */
#soft .viewport-frame>.screen{box-shadow:0 34px 80px -30px rgba(0,0,0,.9)}
#soft .power-blackout{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .12s linear;border-radius:14px}
#soft .power-blackout.is-on{opacity:1;pointer-events:auto}
#soft .rotate-hint{display:none;margin:10px 16px 0;color:var(--tm-muted);font-size:13px;text-align:center}
#message{position:fixed;inset:auto;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) scale(var(--message-scale,1));transform-origin:center;max-width:calc(100vw - 24px)}
#message::backdrop{background:#000a}
#soft .inspect-mode{overflow:auto;justify-content:flex-start;align-items:flex-start;padding:12px}
#soft .inspect-mode .viewport-frame{width:var(--logical-width,800px)!important;height:var(--logical-height,480px)!important}
#soft .inspect-mode .viewport-frame>.screen{transform:none!important}
/* One window tall: the stage row takes what the bar and footer leave; the panel scrolls inside. */
#soft .demo-shell.fits-view{height:100dvh;min-height:560px;overflow:clip}
#soft .demo-shell.fits-view .demo-stage{grid-template-rows:minmax(0,1fr);align-items:stretch}
#soft .demo-shell.fits-view .viewport-area{height:100%}
#soft .demo-shell.fits-view .control-panel{position:relative;top:auto;max-height:none;min-height:0}

/* ---- Control panel: frosted card (website offcanvas) ------------------------ */
#soft .control-panel{position:sticky;top:16px;display:flex;flex-direction:column;gap:20px;padding:20px 18px 18px;max-height:calc(100dvh - 118px);overflow:auto;scrollbar-width:thin;scrollbar-color:#3a414b transparent;overscroll-behavior:contain;
 border:1px solid rgba(255,255,255,.09);border-radius:var(--tm-radius-lg);color:var(--tm-text);
 background:linear-gradient(160deg,rgba(37,39,48,.72) 0%,rgba(17,18,21,.92) 100%);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
 box-shadow:0 24px 70px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.04)}
#soft .control-panel::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--tm-accent),transparent);opacity:.7}
#soft .panel-top{display:none;align-items:center;justify-content:space-between;gap:12px}
#soft .panel-top strong{font-size:20px;font-weight:700}
#soft .panel-section{display:flex;flex-direction:column;gap:10px;min-width:0}
#soft .panel-heading{display:flex;align-items:center;gap:10px;margin:0;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tm-muted);line-height:1}
#soft .panel-heading::after{content:"";flex:1;min-width:2rem;height:1px;background:linear-gradient(90deg,var(--tm-border-light),transparent)}
#soft .panel-hint{margin:-2px 0 0;font-size:12.5px;color:var(--tm-muted);line-height:1.45}
#soft .panel-links{display:none;gap:8px}
#soft .panel-links .tm-btn{flex:1;min-height:40px;font-size:13px}

/* Scenario list */
#soft .scenario-list{display:grid;gap:6px}
#soft .scenario-item{position:relative;overflow:hidden;display:grid;grid-template-columns:34px minmax(0,1fr) 18px;align-items:center;gap:11px;width:100%;min-height:52px;padding:8px 12px 8px 9px;text-align:left;
 color:var(--tm-text);font:inherit;border:1px solid var(--tm-border-light);border-radius:var(--tm-radius);cursor:pointer;
 background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015)),rgba(255,255,255,.015);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
 transition:border-color var(--tm-ease),background-color var(--tm-ease),box-shadow var(--tm-ease),transform var(--tm-ease)}
#soft .scenario-item:hover{border-color:rgba(91,168,245,.45);background:linear-gradient(180deg,rgba(91,168,245,.12),rgba(91,168,245,.04)),rgba(255,255,255,.02);box-shadow:0 12px 28px -18px rgba(61,147,237,.65);transform:translateY(-1px)}
#soft .scenario-item.is-playing{border-color:rgba(91,168,245,.85);background:linear-gradient(135deg,rgba(45,212,191,.16),rgba(91,168,245,.30)),rgba(91,168,245,.12);box-shadow:0 14px 32px -18px rgba(61,147,237,.8)}
#soft .scenario-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tm-accent);background:rgba(91,168,245,.10);border:1px solid rgba(91,168,245,.18)}
#soft .scenario-item[data-tone=fault] .scenario-icon{color:#ff9d90;background:rgba(224,120,107,.10);border-color:rgba(224,120,107,.22)}
#soft .scenario-item[data-tone=link] .scenario-icon{color:#e9c27a;background:rgba(232,160,75,.10);border-color:rgba(232,160,75,.22)}
#soft .scenario-item[data-tone=ok] .scenario-icon{color:var(--tm-teal);background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.22)}
#soft .scenario-icon svg{width:19px;height:19px}
#soft .scenario-text{min-width:0}
#soft .scenario-text strong{display:block;font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#soft .scenario-text small{display:block;font-size:12px;color:var(--tm-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#soft .scenario-go{width:18px;height:18px;color:var(--tm-muted);transition:color var(--tm-ease)}
#soft .scenario-item:hover .scenario-go,#soft .scenario-item.is-playing .scenario-go{color:var(--tm-accent)}
#soft .scenario-progress{position:absolute;left:0;bottom:0;height:2px;width:var(--progress,0%);background:linear-gradient(90deg,var(--tm-teal),var(--tm-accent));box-shadow:0 0 8px var(--tm-accent)}

/* Playback */
#soft .play-status{display:flex;flex-direction:column;gap:2px;min-width:0;padding:10px 12px;border-radius:var(--tm-radius);border:1px solid var(--tm-border);background:rgba(0,0,0,.22)}
#soft .play-status strong{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#soft .play-status small{font-size:12.5px;color:var(--tm-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#soft .play-status[data-tone=fault] small{color:#ff9d90}
#soft .play-status[data-tone=link] small{color:#e9c27a}
#soft .transport{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
#soft .transport .tm-btn{flex-direction:column;gap:3px;min-height:58px;padding:7px 6px;font-size:12px;font-weight:600}
#soft .transport .tm-btn svg{width:20px;height:20px}
#soft .speed-row{display:flex;align-items:center;gap:10px}
#soft .speed-row>span{font-size:12.5px;color:var(--tm-muted);flex:none;min-width:44px}
#soft .speed-row .seg{flex:1}
#soft .panel-wide{width:100%}

/* Segmented pills (website filter pills) */
#soft .seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:999px;border:1px solid var(--tm-border-light);background:rgba(255,255,255,.02)}
#soft .seg button{min-width:0;min-height:36px;padding:0 6px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--tm-soft);font:600 13px/1 var(--tm-font);cursor:pointer;white-space:nowrap;transition:color var(--tm-ease),background-color var(--tm-ease),box-shadow var(--tm-ease)}

#soft .panel-footer{display:flex;gap:8px;padding-top:4px;border-top:1px solid var(--tm-border)}

#soft .demo-foot{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;padding:8px 16px 22px;color:var(--tm-muted);font-size:12.5px;line-height:1.5;text-align:center}

/* ---- Side menu (mobile and fullscreen) ----------------------------------------- */

#soft .demo-shell.uses-drawer .control-panel{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(360px,88vw);max-height:none;border-radius:0;border-width:0 0 0 1px;
 transform:translateX(104%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
#soft .demo-shell.uses-drawer.drawer-open .control-panel{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#soft .demo-shell.uses-drawer .panel-top{display:flex}
/* The scrim fades with the slide instead of snapping on and off. */
#soft .demo-shell.uses-drawer .drawer-scrim{display:block;position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .28s ease}

#soft .demo-shell.uses-drawer:not(.is-full) .bar-controls{display:inline-flex}

#soft .demo-shell.is-full{height:100dvh;min-height:0;overflow:hidden;background:#000}
#soft .demo-shell.is-full .site-bar,#soft .demo-shell.is-full .demo-foot,#soft .demo-shell.is-full .rotate-hint{display:none}

 transform:translateY(-50%);border-right:0;border-radius:var(--tm-radius) 0 0 var(--tm-radius);font-size:12px;letter-spacing:.08em;
 background:linear-gradient(180deg,rgba(45,212,191,.18),rgba(91,168,245,.32)),rgba(17,18,21,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 box-shadow:-6px 0 18px -8px rgba(61,147,237,.5),inset 0 1px 0 rgba(255,255,255,.08);animation:tm-handle-pulse 3.2s ease-in-out 2}
#soft .demo-shell.is-full .drawer-handle .icon{width:18px;height:18px}

#soft .demo-shell.is-full.drawer-open .drawer-handle{display:none}

 color:#e9c27a;border:1px solid rgba(232,160,75,.4);background:rgba(232,160,75,.1);opacity:0;animation:tm-intro-rise .6s ease 1.3s forwards}

@media (prefers-reduced-motion:reduce){#soft .intro-mark svg,#soft .intro-name,#soft .intro-product,#soft .intro-status{animation:none;opacity:1;transform:none}#soft .demo-intro{transition:none}}

<script>
'use strict';
const $=id=>document.getElementById(id);
// Keep the legacy HMI fragment inert until the bootstrap can place it inside the shared demo shell.
const materializeDemoMarkup=()=>{const source=$('demo-markup');if(source){const holder=document.createElement('div');holder.innerHTML=source.textContent;source.replaceWith(...holder.childNodes);}};
materializeDemoMarkup();
// Choice and date/time dialogs put their controls in #message-body; closing empties it
// (unless another dialog has opened in the meantime: the close event arrives late).
$('message').addEventListener('close',()=>{if(!$('message').open)$('message-body').replaceChildren();});
// Demo data fixtures. The control panel and scenarios set these; the HMI only reads them.
const demoFixtures={program:'full',device:'current',connection:'disabled',restartAssessment:'ok',restartResult:'accepted'};
const PROGRAM_MAX_TEMPERATURE_C=180,PROGRAM_MAX_RATE_TENTHS=30,PROGRAM_MAX_CURING_MINUTES=2880;
const initial={rate:3,temperature:200,duration:720,brightness:80,dim:0,motion:'Off',view:'Split',format:'24-hour',dateFormat:'text',theme:HMI_THEMES[0].id,language:HMI_LANGUAGES[0].tag};
let mainPage='home',deviceTab='overview',deviceFilter='all',devicePage=0,selectedComponent=null;
let programEditor=null,programLoadOrigin='home',manualDraft={target:120,rate:2},manualRun=null,manualStatusNotice='';
const controller={session:1,pending:null,light:false,events:[],requestId:0,phase:'idle',limits:{maxTemperature:180,maxRate:3,maxCuringMinutes:2880}};
// Session log entries hold string ids (source, event, result) and are translated when shown.
function controllerEvent(source,event,result='UI_LAB_EVENT_CONFIRMED'){const now=new Date();controller.events.unshift({time:clockTime(now.getHours(),now.getMinutes(),candidate.format==='12-hour'),source,event,result});controller.events=controller.events.slice(0,24);}
function controllerRequest(event,apply){const requestId=++controller.requestId;controller.pending=event;controllerEvent('UI_LAB_SOURCE_HMI',event,'UI_LAB_EVENT_REQUESTED');render();window.setTimeout(()=>{if(requestId!==controller.requestId)return;controller.pending=null;apply();controllerEvent('UI_LAB_DEVICE_CONTROL_CPU',event,'UI_LAB_EVENT_ACCEPTED');render();},180);}
function controllerLimits(){return controller.limits;}
let saved={...initial},candidate={...saved},tab='display',displayPage=0,editing=null;
const dirty=()=>Object.keys(saved).some(k=>saved[k]!==candidate[k]);
const duration=v=>t('UI_LAB_HOURS_MINUTES_LONG_FORMAT',Math.floor(v/60),v%60);
// Theme: colours are the CSS custom properties generated from themes.json
// (the hmi-theme block); drawing code reads them through themeColor().
let themeColors=null;
function themeColor(name){if(!themeColors){const style=getComputedStyle(document.documentElement);themeColors={};for(const token of HMI_THEME_TOKENS)themeColors[token]=style.getPropertyValue('--'+token).trim();}return themeColors[name];}
// Theme and language are display preferences: the edited (unsaved) choice is shown at once,
// Discard and Reset show the restored one. render() applies them before drawing anything.
function applyPresentation(){const root=document.documentElement;if(root.dataset.hmiTheme!==candidate.theme){root.dataset.hmiTheme=candidate.theme;themeColors=null;}hmiLanguage=candidate.language;document.querySelector('.screen').lang=hmiLanguage;$('message').lang=hmiLanguage;}
// Switch theme by id (HMI_THEMES) as a saved preference, then redraw.
function setHmiTheme(id){if(!HMI_THEMES.some(theme=>theme.id===id))return false;saved.theme=candidate.theme=id;render();return true;}
// Text: the shared catalogue (the hmi-strings block, generated from
// app/hmi/presentation/strings/catalogue by tools/build_strings.py). Never write
// visible text here: t(id,...args) formats with C printf syntax, tp(id,{field})
// fills {field} patterns, and button()/tell() accept a string id.
let hmiLanguage=HMI_LANGUAGES[0].tag,hmiStringOverride=null;
const isTextId=v=>typeof v==='string'&&/^[A-Z][A-Z0-9_]*$/.test(v)&&HMI_STRINGS.en[v]!==undefined;
function t(id,...args){const text=(hmiStringOverride&&hmiStringOverride[id])??(HMI_STRINGS[hmiLanguage]||{})[id]??HMI_STRINGS.en[id];if(text===undefined){console.error('Unknown string '+id);return id;}return args.length?printf(text,args):text;}

 const fields=[['UI_LAB_SETTINGS_DAY',()=>String(draft.day),d=>{draft.day=wrap(draft.day+d,1,daysInMonth(draft.year,draft.month));}],
  ['UI_LAB_SETTINGS_MONTH',()=>t(MONTH_IDS[draft.month-1]),d=>{draft.month=wrap(draft.month+d,1,12);}],
  ['UI_LAB_SETTINGS_YEAR',()=>String(draft.year),d=>{draft.year=Math.max(2020,Math.min(2099,draft.year+d));}],
  ['UI_LAB_SETTINGS_HOUR',()=>twelve?String(draft.hour%12||12):String(draft.hour).padStart(2,'0'),d=>{draft.hour=wrap(draft.hour+d,0,23);}],
  ['UI_LAB_SETTINGS_MINUTE',()=>String(draft.minute).padStart(2,'0'),d=>{draft.minute=wrap(draft.minute+d,0,59);}]];

 {id:'complete',title:'Complete run',detail:'Whole program, then automatic cooling',icon:'check',tone:'ok',program:1},
 {id:'overtemperature',title:'Overheating',detail:'Overshoots and trips its limit',icon:'flame',tone:'fault',program:2,at:330,profile:t=>t>300?Math.pow((t-300)/30,2)*24:0},
 {id:'heating-slow',title:'Not heating enough',detail:'Falls behind and misses the target',icon:'thermometer',tone:'fault',program:1,at:66,profile:t=>t>14?-Math.pow((t-14)/52,1.4)*30:0},
 {id:'sensor-fault',title:'Sensor failure',detail:'Reading turns erratic, then is lost',icon:'pulse',tone:'fault',program:0,at:70,profile:t=>t>54?Math.sin(t*2.3)*(t-54)*.8:0},
 {id:'power-loss',title:'Power loss',detail:'Mains power drops during a run',icon:'power',tone:'fault',program:2,at:50},
 {id:'link-lost',title:'Connection lost',detail:'Display loses, then regains, the controller',icon:'link-off',tone:'link',program:2,at:70}];
const SCENARIO_TICK_MS=100,SCENARIO_RUN_MS=4600;
function setBlackout(on){const blackout=$('power-blackout');if(blackout)blackout.classList.toggle('is-on',on);}
function stopScenario(){if(!scenarioPlayer)return;window.clearInterval(scenarioPlayer.timer);scenarioPlayer=null;}
// Back to an idle furnace on Home: no run, fault, link loss, open dialog, keyboard or editor session.
function resetDemoState(){
 stopScenario();setBlackout(false);if($('message').open)$('message').close();if(touchKeyboard)closeTouchKeyboard(false);
 hideStageDialog();stageSession=null;programEditor=null;demoRun=null;manualRun=null;runNotice=false;
 demoFault=null;demoLinkLost=false;linkLostMinutes=0;demoFixtures.device='current';
 controller.requestId++;controller.pending=null;controller.phase='idle';candidate={...saved};demoFrozen=false;
 mainPage='home';programRoute='library';
}
function playScenario(id){
 const scenario=DEMO_SCENARIOS.find(item=>item.id===id);if(!scenario)return;
 resetDemoState();beginDemoRun(scenario.program,0);demoRun.profile=scenario.profile||null;runView=scenario.view||'graph';render();
 scenarioPlayer={scenario,clock:0,stage:'run',progress:0,timer:window.setInterval(stepScenario,SCENARIO_TICK_MS)};updateExpoControls();
}
function finishScenario(){stopScenario();updateExpoControls();}
function stepScenario(){
 const player=scenarioPlayer;if(!player||demoFrozen)return;
 const scenario=player.scenario;player.clock+=SCENARIO_TICK_MS;
 if(['run','cooling','link'].includes(player.stage)&&!demoRun){finishScenario();return;}
 if(player.stage==='run'){
  if(demoRun.paused)return;
  const progress=Math.min(1,player.clock/SCENARIO_RUN_MS),end=scenario.at??demoRun.program.minutes;
  // Ease out so the run slows as it approaches the event.
  demoRun.elapsed=Math.max(demoRun.elapsed,end*(1-Math.pow(1-progress,1.6)));player.progress=progress*.85;
  if(progress<1){if(!touchKeyboard)render();updateExpoControls();return;}
  player.clock=0;demoRun.elapsed=end;
  if(scenario.id==='complete'){enterCooling(demoRun);player.stage='cooling';render();updateExpoControls();return;}
  if(scenario.id==='power-loss'){if($('message').open)$('message').close();if(touchKeyboard)closeTouchKeyboard(false);render();setBlackout(true);player.stage='blackout';updateExpoControls();return;}
  if(scenario.id==='link-lost'){setLinkLost(true);player.stage='link';return;}
  player.progress=1;reportControllerFault(scenario.id);finishScenario();return;
 }
 if(player.stage==='cooling'){
  if(demoRun.phase==='complete'){finishScenario();return;}
  advanceCooling(demoRun,10);player.progress=Math.min(.99,player.progress+.04);render();updateExpoControls();return;
 }
 if(player.stage==='blackout'){
  if(player.clock<1500)return;
  // Power returns: the display starts again and reads the controller's state, in which the run has ended.
  if(demoRun&&demoRun.mode==='program')logEvent('alarm',{fault:'power-loss',name:demoRun.program.name});logEvent('display-started');
  demoRun=null;manualRun=null;controller.phase='idle';demoFault='power-loss';controllerEvent('UI_LAB_DEVICE_CONTROL_CPU','UI_LAB_ALERT_POWER_INTERRUPTED_TITLE','UI_LAB_EVENT_REPORTED');
  mainPage='home';render();setBlackout(false);player.stage='restart';player.clock=0;updateExpoControls();return;
 }
 if(player.stage==='restart'){if(player.clock<400)return;player.progress=1;showControllerAlert('power-loss');finishScenario();return;}
 if(player.stage==='link'){
  // The controller keeps running while the display cannot see it.
  linkLostMinutes+=.5;player.progress=Math.min(.99,.85+player.clock/3200*.14);updateExpoControls();
  if(player.clock<3200)return;player.progress=1;setLinkLost(false);finishScenario();
 }
}

// ---- Playback ----------------------------------------------------------------
function togglePlayback(){demoFrozen=!demoFrozen;updateExpoControls();}
function stageStartsOf(p){const starts=[];let time=0;for(const stage of p.stages){starts.push(time);time+=stage.minutes;}return starts;}
// Back to the start of this stage, or the previous one when already at its start; from cooling, the last stage.
function previousDemoStage(){
 if(!demoRun||demoRun.mode!=='program'||demoRun.phase==='fault')return;stopScenario();
 const p=demoRun.program,starts=stageStartsOf(p);
 if(demoRun.phase==='cooling'||demoRun.phase==='complete'){
  demoRun.phase='curing';demoRun.elapsed=starts[starts.length-1];demoRun.coolingElapsed=0;demoRun.coolingTemperature=demoMeasured(p,p.minutes);demoRun.coolingRemaining=p.coolingMinutes;demoRun.coolingHistory=[{t:0,v:demoRun.coolingTemperature}];runCoolingFull=false;controller.phase='curing';
 }else{const index=runStage(),into=demoRun.elapsed-starts[index];demoRun.elapsed=index===0||into>Math.max(1,p.stages[index].minutes*.05)?starts[index]:starts[index-1];}
 render();updateExpoControls();
}
// To the start of the next stage; from the last stage into automatic cooling; from cooling to its end.
function nextDemoStage(){
 if(!demoRun||demoRun.mode!=='program'||!['curing','cooling'].includes(demoRun.phase))return;stopScenario();
 const p=demoRun.program;
 if(demoRun.phase==='curing'){const next=runStage()+1;if(next>=p.stages.length){demoRun.elapsed=p.minutes;enterCooling(demoRun);}else demoRun.elapsed=stageStartsOf(p)[next];}
 else for(let guard=0;guard<500&&demoRun.phase==='cooling';guard++)advanceCooling(demoRun,5);
 render();updateExpoControls();
}
function startExampleRun(){resetDemoState();beginDemoRun(0,0);render();updateExpoControls();closeDrawerInFullscreen();}
function resetDemoSession(){confirmAction('Reset demo session?','Reload the page and restore the premade examples, preferences and local demo state?','Reset demo session',()=>window.location.reload());}

// ---- Panel state ---------------------------------------------------------------
function updateExpoControls(){
 const shell=$('demo-shell');if(!shell)return;
 const uses=usesDemoDrawer();if(!uses)drawerOpen=false;shell.classList.toggle('drawer-open',uses&&drawerOpen);
 const full=isDemoFullscreen();
 setDemoButton($('fullscreen-toggle'),full?'Exit fullscreen':'Fullscreen',full?'shrink':'expand');
 const blackout=$('power-blackout')?.classList.contains('is-on');
 let title='No program running',detail='Start a program on the screen, or play a scenario.',tone='';
 if(blackout){title='Power off';detail='The furnace and this display have no power.';tone='fault';}
 else if(demoRun&&demoRun.mode==='manual'){title='Manual mode';detail=formatClock(demoRun.elapsed)+' elapsed';}
 else if(demoRun){const p=demoRun.program,index=runStage();title=p.name;
  detail=demoRun.phase==='fault'?'Stopped: '+CONTROLLER_ALERTS[demoRun.fault].title:demoRun.phase==='complete'?'Cooling complete':demoRun.phase==='cooling'?'Automatic cooling · '+formatClock(demoRun.coolingElapsed):`Stage ${index+1} of ${p.count} · ${formatClock(demoRun.elapsed)} elapsed`;
  if(demoRun.phase==='fault')tone='fault';}
 else if(demoFault){title='Furnace idle';detail='Last fault: '+CONTROLLER_ALERTS[demoFault].title;tone='fault';}
 if(demoLinkLost&&!blackout){detail='Controller link lost';tone='link';}
 const status=$('play-status');status.dataset.tone=tone;status.children[0].textContent=title;status.children[1].textContent=detail;
 const program=!!demoRun&&demoRun.mode==='program'&&!demoLinkLost;
 $('stage-previous').disabled=!(program&&['curing','cooling','complete'].includes(demoRun.phase));
 $('next-stage').disabled=!(program&&['curing','cooling'].includes(demoRun.phase));
 const play=$('playback-toggle');setDemoButton(play,demoFrozen?'Play':'Pause',demoFrozen?'play':'pause');play.setAttribute('aria-pressed',String(demoFrozen));play.disabled=!demoRun&&!scenarioPlayer;
 $('start-example').hidden=!!demoRun||!!scenarioPlayer;
 const keyboardBlocked=!!blackout||(!!demoRun&&demoRun.mode!=='manual');$('try-text-keyboard').disabled=keyboardBlocked;$('try-number-keyboard').disabled=keyboardBlocked;
 for(const item of document.querySelectorAll('.scenario-item')){const playing=!!scenarioPlayer&&scenarioPlayer.scenario.id===item.dataset.scenario;item.classList.toggle('is-playing',playing);item.style.setProperty('--progress',playing?Math.round(scenarioPlayer.progress*100)+'%':'0%');if(playing)item.setAttribute('aria-current','true');else item.removeAttribute('aria-current');}
 for(const group of document.querySelectorAll('.control-panel .seg'))group.sync();
}
function positionNativeDialog(){
 const dialog=$('message'),frame=$('viewport-frame');if(!dialog||!dialog.open||!frame)return;
 const rect=frame.getBoundingClientRect();dialog.style.left=rect.left+rect.width/2+'px';dialog.style.top=rect.top+rect.height/2+'px';dialog.style.setProperty('--message-scale',String(demoViewport.mode==='inspect'?1:demoViewport.scale));
}
function isDemoFullscreen(){const shell=$('demo-shell');return !!shell&&(document.fullscreenElement===shell||shell.classList.contains('is-fallback-fullscreen'));}
// Mobile (narrow, or a short landscape phone): the controls always live in the side menu.
const COMPACT_QUERY=window.matchMedia('(max-width:760px), (orientation:landscape) and (max-height:520px)'),WIDE_QUERY=window.matchMedia('(min-width:1181px)');
// Below the wide layout there is no room beside the screen, so the panel is a side menu there too.
function usesDemoDrawer(){return isDemoFullscreen()||COMPACT_QUERY.matches||!WIDE_QUERY.matches;}
// Layout mode classes (see the CSS): fullscreen, mobile, side menu, and one-window-tall pages.
function applyDemoLayout(){
 const shell=$('demo-shell'),full=isDemoFullscreen(),compact=COMPACT_QUERY.matches;
 shell.classList.toggle('is-full',full);shell.classList.toggle('is-compact',compact);shell.classList.toggle('uses-drawer',usesDemoDrawer());
 shell.classList.toggle('fits-view',!full);
}
// Height left for the HMI: the window less the website bar, page padding and the bezel around the screen.
function demoAvailableHeight(){
 const shell=$('demo-shell');if(!shell)return demoViewport.height;const view=window.visualViewport?window.visualViewport.height:window.innerHeight;
 if(isDemoFullscreen())return view;
 // One window tall: the stage row already excludes the bar, hint and footer.
 if(shell.classList.contains('fits-view'))return Math.max(120,$('viewport-area').clientHeight-20);
 const bar=shell.querySelector('.site-bar'),stage=shell.querySelector('.demo-stage'),hint=$('rotate-hint'),box=getComputedStyle(stage);
 let reserved=(bar?bar.offsetHeight:0)+parseFloat(box.paddingTop)+parseFloat(box.paddingBottom)+20;if(hint&&hint.offsetParent)reserved+=hint.offsetHeight+10;
 return Math.max(120,view-reserved);
}
function updateDemoViewport(){
 const area=$('viewport-area'),frame=$('viewport-frame'),screen=document.querySelector('.screen');if(!area||!frame||!screen)return;
 applyDemoLayout();const full=isDemoFullscreen();
 const bezel=full?0:20,availableWidth=Math.max(1,area.clientWidth-bezel),availableHeight=demoAvailableHeight();
 // Fit: up to 2x beside the panel, as large as the display allows in fullscreen; Actual pixels: 1:1.
 demoViewport.scale=demoViewport.mode==='inspect'?1:Math.min(availableWidth/demoViewport.width,availableHeight/demoViewport.height,full?4:2);
 if(!Number.isFinite(demoViewport.scale)||demoViewport.scale<=0)demoViewport.scale=1;
 area.classList.toggle('inspect-mode',demoViewport.mode==='inspect');area.style.setProperty('--logical-width',demoViewport.width+'px');area.style.setProperty('--logical-height',demoViewport.height+'px');
 frame.style.width=demoViewport.width*demoViewport.scale+'px';frame.style.height=demoViewport.height*demoViewport.scale+'px';
 screen.style.width=demoViewport.width+'px';screen.style.height=demoViewport.height+'px';screen.style.transform=demoViewport.mode==='inspect'?'none':'scale('+demoViewport.scale+')';
 updateExpoControls();positionNativeDialog();
}
function setDemoSize(value){
 const values=(String(value).match(/\d+/g)||[]).map(Number);if(values.length<2)return;
 demoViewport.width=values[0];demoViewport.height=values[1];updateDemoViewport();
 // Pages fitted to the screen (Quick launch drops programs that do not fit) are drawn again for the new size.
 if(!touchKeyboard)render();
}
async function toggleDemoFullscreen(){
 const shell=$('demo-shell');drawerOpen=false;
 if(document.fullscreenElement===shell){await document.exitFullscreen().catch(()=>{});return;}
 if(shell.classList.contains('is-fallback-fullscreen')){shell.classList.remove('is-fallback-fullscreen');updateDemoViewport();return;}
 if(!document.fullscreenEnabled||!shell.requestFullscreen){shell.classList.add('is-fallback-fullscreen');updateDemoViewport();return;}
 try{await shell.requestFullscreen({navigationUI:'hide'});}catch(error){shell.classList.add('is-fallback-fullscreen');}
 updateDemoViewport();
}
function setDrawer(open){
 drawerOpen=open&&usesDemoDrawer();updateExpoControls();
 if(drawerOpen)$('drawer-close').focus();else if(usesDemoDrawer())$(isDemoFullscreen()?'drawer-toggle':'bar-controls').focus();
}
// A panel action that changes the screen closes the side menu so the result is visible.
function closeDrawerInFullscreen(){if(drawerOpen)setDrawer(false);}


function buildControlPanel(){
 const panel=node('aside',undefined,'control-panel');panel.id='control-panel';panel.setAttribute('aria-label','Demo controls');
 const top=node('div',undefined,'panel-top');top.append(node('strong','Demo controls'),demoButton('Close',()=>setDrawer(false),{id:'drawer-close',iconName:'close'}));

 const scenarios=panelSection('Scenarios','panel-scenarios');scenarios.append(node('p','Each one fast-forwards a run to a real-world event in a few seconds.','panel-hint'));
 const list=node('div',undefined,'scenario-list');
 for(const scenario of DEMO_SCENARIOS){
  const item=document.createElement('button');item.type='button';item.className='scenario-item';item.dataset.scenario=scenario.id;item.dataset.tone=scenario.tone;
  const badge=node('span',undefined,'scenario-icon');badge.append(demoIcon(scenario.icon));const text=node('span',undefined,'scenario-text');text.append(node('strong',scenario.title),node('small',scenario.detail));
  const go=demoIcon('play');go.classList.add('scenario-go');item.append(badge,text,go,node('span',undefined,'scenario-progress'));
  item.addEventListener('click',()=>{closeDrawerInFullscreen();playScenario(scenario.id);});list.append(item);
 }
 scenarios.append(list);

 const playback=panelSection('Playback','panel-playback'),status=node('div',undefined,'play-status');status.id='play-status';status.setAttribute('aria-live','polite');status.append(node('strong'),node('small'));
 const transport=node('div',undefined,'transport');
 transport.append(demoButton('Previous stage',previousDemoStage,{id:'stage-previous',iconName:'previous'}),demoButton('Pause',togglePlayback,{id:'playback-toggle',iconName:'pause',className:'tm-btn tm-btn-accent',title:'Pause or play the simulation clock'}),demoButton('Next stage',nextDemoStage,{id:'next-stage',iconName:'next'}));
 const speed=node('div',undefined,'speed-row');speed.append(node('span','Speed'),segmented('demo-speed','Playback speed',DEMO_SPEEDS.map(value=>[String(value),value===1?'Real':value+'×']),value=>Number(value)===demoSpeed,value=>{demoSpeed=Number(value);}));
 playback.append(status,transport,speed,demoButton('Start example run',startExampleRun,{id:'start-example',iconName:'play',className:'tm-btn tm-btn-outline panel-wide'}));

 const display=panelSection('Screen','panel-screen');
 display.append(segmented('demo-size','Screen size',DEMO_SIZES.map(([w,h])=>[w+'x'+h,w+'×'+h]),value=>value===demoViewport.width+'x'+demoViewport.height,setDemoSize),
  segmented('demo-scale','Scale',[['fit','Fit to window'],['inspect','Actual pixels']],value=>value===demoViewport.mode,value=>{demoViewport.mode=value;updateDemoViewport();}),
  demoButton('Fullscreen',toggleDemoFullscreen,{id:'fullscreen-toggle',iconName:'expand',className:'tm-btn tm-btn-accent panel-wide'}));

 const library=panelSection('Program library','panel-library');
 library.append(segmented('demo-library','Program library',[['full','3 programs'],['empty','No programs']],value=>value===demoFixtures.program,value=>{demoFixtures.program=value;programPage=0;if(mainPage==='programs')programRoute='library';render();}));

 const keyboards=panelSection('On-screen keyboards','panel-keyboards'),pair=node('div',undefined,'button-pair');
 pair.append(demoButton('Letters',()=>{closeDrawerInFullscreen();previewTextKeyboard();},{id:'try-text-keyboard',iconName:'keyboard'}),demoButton('Numbers',()=>{closeDrawerInFullscreen();previewNumericKeyboard();},{id:'try-number-keyboard',iconName:'keypad'}));keyboards.append(pair);

 const footer=node('div',undefined,'panel-footer');footer.append(demoButton('Reset demo',resetDemoSession,{id:'reset-demo-session',iconName:'reset'}));
 // On mobile the website links move from the bar into the menu.
 const siteLinks=node('div',undefined,'panel-links');siteLinks.append(demoLink('Back to website',SITE_URL,'tm-btn tm-btn-outline','arrow-left'),demoLink('Get a quote',QUOTE_URL,'tm-btn tm-btn-accent','arrow-right',true));
 // The same order beside the screen and in the side menu.
 panel.append(top,display,playback,scenarios,keyboards,library,siteLinks,footer);return panel;
}
// Shown on entering the page: logo, company, product and status, then the demo. A tap or key skips it; ?intro=off leaves it out.
const INTRO_MS=2900;
function skipDemoIntro(){const intro=$('demo-intro');if(!intro||intro.classList.contains('is-leaving'))return;window.clearTimeout(intro.timer);intro.classList.add('is-leaving');window.setTimeout(()=>intro.remove(),650);}
function showDemoIntro(shell){
 if(new URLSearchParams(location.search).get('intro')==='off')return;
 const intro=node('div',undefined,'demo-intro'),mark=node('div',undefined,'intro-mark'),logo=brandMark();intro.id='demo-intro';intro.setAttribute('role','presentation');
 mark.append(logo,node('div','Telamorph','intro-name'),node('div','HMI Demo V2','intro-product'),node('div','Work in progress','intro-status'));intro.append(mark);shell.append(intro);
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;intro.timer=window.setTimeout(skipDemoIntro,reduced?1800:INTRO_MS);
 intro.addEventListener('click',skipDemoIntro);document.addEventListener('keydown',skipDemoIntro,{once:true});
}
// One faint line at the bottom of the page: this is software in development, not a final product.
function devWatermark(){return node('p','Software in development · Not a final product','dev-watermark');}
function setupDemoShell(){
 if($('demo-shell'))return;
 const screen=document.querySelector('.screen'),outside=document.querySelector('.outside'),dialog=$('message'),shell=node('div',undefined,'demo-shell');shell.id='demo-shell';
 const bar=node('header',undefined,'site-bar'),brand=document.createElement('a');brand.className='site-brand';brand.href='https://telamorph.com/';brand.setAttribute('aria-label','Telamorph home');brand.append(brandMark(),node('span','Telamorph'));
 const title=node('div',undefined,'site-title');title.append(node('strong','MPK furnace control screen'),node('span','Work in progress','live-pill'));
 const links=node('nav',undefined,'site-actions');links.setAttribute('aria-label','Telamorph website');
 links.append(demoLink('Back to website',SITE_URL,'tm-btn tm-btn-outline site-back','arrow-left',false,'Website'),demoLink('Get a quote',QUOTE_URL,'tm-btn tm-btn-accent','arrow-right',true,'Quote'),
  demoButton('Controls',()=>setDrawer(true),{id:'bar-controls',iconName:'menu',className:'tm-btn tm-btn-outline bar-controls'}));
 bar.append(brand,title,links);
 const stage=node('main',undefined,'demo-stage'),area=node('div',undefined,'viewport-area'),frame=node('div',undefined,'viewport-frame'),blackout=node('div',undefined,'power-blackout');
 area.id='viewport-area';frame.id='viewport-frame';blackout.id='power-blackout';
 screen.parentNode.insertBefore(shell,screen);frame.append(screen,blackout);area.append(frame);stage.append(area,buildControlPanel());
 const hint=node('p','Turn your phone sideways for a larger screen.','rotate-hint');hint.id='rotate-hint';
 const foot=node('footer',undefined,'demo-foot');foot.append(...outside.childNodes);outside.remove();
 const handle=demoButton('Controls',()=>setDrawer(true),{id:'drawer-toggle',iconName:'menu',className:'tm-btn tm-btn-accent drawer-handle'}),scrim=node('div',undefined,'drawer-scrim');scrim.addEventListener('click',()=>setDrawer(false));
 foot.prepend(devWatermark());shell.append(bar,hint,stage,foot,handle,scrim,dialog);showDemoIntro(shell);
 document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement!==shell)shell.classList.remove('is-fallback-fullscreen');drawerOpen=false;updateDemoViewport();});
 document.addEventListener('keydown',event=>{if(event.key!=='Escape'||touchKeyboard||document.querySelector('dialog[open]'))return;if(drawerOpen)setDrawer(false);else if(shell.classList.contains('is-fallback-fullscreen'))toggleDemoFullscreen();});
 window.addEventListener('resize',updateDemoViewport);window.visualViewport?.addEventListener('resize',updateDemoViewport);
 // The HMI dialog is positioned over the scaled screen; alert styling ends with the alert.
 const nativeShowModal=dialog.showModal.bind(dialog);dialog.showModal=()=>{if(!$('message-title').querySelector('.icon')){dialog.classList.remove('alert-dialog','alert-fault','alert-link','alert-ok');delete dialog.dataset.alert;}nativeShowModal();positionNativeDialog();requestAnimationFrame(positionNativeDialog);};
 dialog.addEventListener('close',()=>{dialog.style.removeProperty('--message-scale');if(!dialog.open){dialog.classList.remove('alert-dialog','alert-fault','alert-link','alert-ok');delete dialog.dataset.alert;}});
 if(typeof ResizeObserver!=='undefined'){viewportObserver=new ResizeObserver(updateDemoViewport);viewportObserver.observe(area);}
 setDemoSize('800x480');
}
buildDeviceLog(wallMinutes(clockNow()));logEvent('display-started');
setupDemoShell();
render();
startDemoClock();
