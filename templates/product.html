<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@@HEAD_TITLE@@</title>
    <meta name="description" content="@@DESCRIPTION@@" />
    <link rel="canonical" href="@@CANONICAL@@" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/assets/images/brand/logo.svg" />

    <meta property="og:site_name" content="Telamorph" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="@@OG_TITLE@@" />
    <meta property="og:description" content="@@DESCRIPTION@@" />
    <meta property="og:type" content="product" />
    <meta property="og:url" content="@@CANONICAL@@" />
    <meta property="og:image" content="@@OG_IMAGE@@" />
    <meta property="og:image:alt" content="@@IMAGE_ALT@@" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="@@OG_TITLE@@" />
    <meta name="twitter:description" content="@@DESCRIPTION@@" />
    <meta name="twitter:image" content="@@OG_IMAGE@@" />
    <meta name="twitter:image:alt" content="@@IMAGE_ALT@@" />
    <meta name="theme-color" content="#111215" />

    <link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/components/navbar.css" />
    <link rel="stylesheet" href="/assets/css/components/footer.css" />
    <link rel="stylesheet" href="/assets/css/components/product-card.css" />
    <link rel="stylesheet" href="/assets/css/components/buttons.css" />
    <link rel="stylesheet" href="/assets/css/components/breadcrumb.css" />
    <link rel="stylesheet" href="/assets/css/components/section-header.css" />
    <link rel="stylesheet" href="/assets/css/components/noscript.css" />
    <link rel="stylesheet" href="/assets/css/components/streak.css" />
    <link rel="stylesheet" href="/assets/css/pages/product-detail.css" />

    <script type="application/ld+json">@@PRODUCT_JSONLD@@</script>
    <style>
      html,
      body {
        background-color: #111215;
      }
    </style>
    <noscript>
      <style>
        .pd-tab-panel[hidden] {
          display: block;
          margin-top: 2rem;
        }
      </style>
    </noscript>
    <script>
      (() => {
        const cacheKeys = {
          nav: "telamorph-shell-nav-v4",
          footer: "telamorph-shell-footer-v2",
        };

        window.__hydrateTelamorphShell = (targetId, slot) => {
          try {
            const target = document.getElementById(targetId);
            const cached = sessionStorage.getItem(cacheKeys[slot]);
            if (!target || target.innerHTML.trim()) return;
            if (cached) target.innerHTML = cached;
          } catch {
            // Ignore storage access failures.
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="nav-placeholder">
@@NAV@@
    </div>

    <main>
      <section class="pd-section">
        <div class="container">
          @@BREADCRUMB@@
          @@PRODUCT_CONTENT@@
        </div>
      </section>
    </main>

    <div id="footer-placeholder">
@@FOOTER@@
    </div>

    <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script src="/assets/js/utils.js" defer></script>
    <script src="/assets/js/main.js?v=20260427" defer></script>
    <script src="/assets/js/product-detail.js" defer></script>
  </body>
</html>
